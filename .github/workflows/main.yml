name: Build Flutter Windows Installer

on:
  push:
    branches: ['main']

jobs:
  build:
    runs-on: windows-latest

    steps:
      # 1. Checkout repo
      - uses: actions/checkout@v4

      # 2. Install Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          architecture: x64

      - name: Verify Flutter installation
        run: flutter --version

      # 3. Enable Windows build
      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      # 4. Install dependencies
      - name: Flutter Pub Get
        run: flutter pub get

      - name: Generate freezed
        run: flutter pub run build_runner build --delete-conflicting-outputs

      # 5. Build Windows App
      - name: Build Windows
        run: flutter build windows --release

      - name: 🛠️ Install Inno Setup (Chocolatey)
        shell: powershell
        run: |
          choco install innosetup -y
          refreshenv
          $iscc = Get-Command iscc -ErrorAction SilentlyContinue
          if (-not $iscc) { throw 'ISCC not found after installation.' }
          iscc /?  # verify installation

      - name: ⚙️ Compile Installer with Inno Setup
        shell: powershell
        run: |
          # Use ISCC from PATH; if you want to call the default install path explicitly, you can:
          $isccPath = (Get-Command iscc).Path
          if (-not (Test-Path $isccPath)) { throw "ISCC executable not found at $isccPath" }
          & $isccPath installer.iss

      # --- Artifact Upload Steps ---

      - name: 📤 Find Installer Executable
        # The default output directory for Inno Setup is 'Output'. We find the .exe file.
        id: find_file
        shell: powershell
        run: |
          $InstallerPath = Get-ChildItem -Path "Output" -Filter "*.exe" | Select-Object -First 1
          if ($InstallerPath) {
            echo "installer_file_path=$($InstallerPath.FullName)" >> $env:GITHUB_OUTPUT
            echo "installer_file_name=$($InstallerPath.Name)" >> $env:GITHUB_OUTPUT
          } else {
            throw "Could not find a compiled .exe installer in the 'Output' directory."
          }

      - name: 🚀 Upload Installer Artifact
        # Uploads the final .exe file to the workflow run artifacts.
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.find_file.outputs.installer_file_name }}
          path: ${{ steps.find_file.outputs.installer_file_path }}
          retention-days: 7
