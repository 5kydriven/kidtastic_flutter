name: Build Flutter Windows Installer

on:
  push:
    branches: ['main']

jobs:
  build:
    runs-on: windows-latest

    steps:
      # 1. Checkout repo
      - uses: actions/checkout@v4

      # 2. Install Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          architecture: x64

      - name: Verify Flutter installation
        run: flutter --version

      # 3. Enable Windows build
      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      # 4. Install dependencies
      - name: Flutter Pub Get
        run: flutter pub get

      - name: Generate freezed
        run: flutter pub run build_runner build --delete-conflicting-outputs

      # 5. Build Windows App
      - name: Build Windows
        run: flutter build windows --release

      - name: 🛠️ Install Inno Setup (Chocolatey)
        shell: powershell
        run: |
          choco install innosetup -y

      - name: ⚙️ Compile Installer with Inno Setup
        shell: powershell
        run: |
          # Use the default Inno Setup installation path
          $isccPath = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"

          if (-not (Test-Path $isccPath)) { 
            throw "ISCC executable not found at $isccPath" 
          }

          Write-Host "Found ISCC at: $isccPath"

          # Compile the installer
          & $isccPath installer.iss

          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup compilation failed with exit code $LASTEXITCODE"
          }

      # --- Artifact Upload Steps ---

      - name: 📤 Find Installer Executable
        id: find_file
        shell: powershell
        run: |
          $InstallerPath = Get-ChildItem -Path "Output" -Filter "*.exe" | Select-Object -First 1
          if ($InstallerPath) {
            echo "installer_file_path=$($InstallerPath.FullName)" >> $env:GITHUB_OUTPUT
            echo "installer_file_name=$($InstallerPath.Name)" >> $env:GITHUB_OUTPUT
            Write-Host "Found installer: $($InstallerPath.Name)"
          } else {
            throw "Could not find a compiled .exe installer in the 'Output' directory."
          }

      - name: 🚀 Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.find_file.outputs.installer_file_name }}
          path: ${{ steps.find_file.outputs.installer_file_path }}
          retention-days: 7
