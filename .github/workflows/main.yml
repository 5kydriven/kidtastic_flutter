name: Build & Release Flutter Windows App

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'

jobs:
  # ------------------------------
  build_app:
    runs-on: ubuntu-latest
    outputs:
      artifact_name: windows_build
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          architecture: x64

      - name: Flutter Version (Debug)
        run: flutter --version

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Generate freezed files
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Build Windows App
        run: |
          echo "Starting Flutter Windows build..."
          flutter build windows --release
          echo "Flutter build complete. Listing output folder:"
          ls -la build/windows/runner/Release/

      - name: Upload Windows Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows_build
          path: build/windows/runner/Release/
          retention-days: 7

  # ------------------------------
  compile_installer:
    runs-on: windows-latest
    needs: build_app
    steps:
      - uses: actions/checkout@v4

      - name: Download Windows Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: windows_build
          path: build/windows/runner/Release/

      - name: List downloaded build files
        shell: powershell
        run: |
          Write-Host "Listing build files in runner:"
          Get-ChildItem -Path build/windows/runner/Release/ -Recurse

      # ------------------------------
      - name: Install Inno Setup with winget
        shell: powershell
        run: |
          Write-Host "Installing Inno Setup via winget..."
          winget install --id JRSoftware.InnoSetup -e -s winget -i
          Write-Host "Installed Inno Setup, checking version..."
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /?

      # ------------------------------
      - name: Compile Installer
        shell: powershell
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found!" }
          Write-Host "ISCC found at: $iscc"

          # Ensure Output folder exists
          New-Item -ItemType Directory -Force -Path Output

          Write-Host "Compiling installer..."
          & $iscc "installer.iss" /OOutput

          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed with exit code $LASTEXITCODE" }

          Write-Host "Installer compilation completed."
          Write-Host "Listing files in Output folder:"
          Get-ChildItem -Path Output

      # ------------------------------
      - name: Find Installer
        id: find_installer
        shell: powershell
        run: |
          $installer = Get-ChildItem -Path Output -Filter "*.exe" | Select-Object -First 1
          if (-not $installer) { throw "Installer not found!" }
          Write-Host "Installer found: $($installer.FullName)"
          echo "installer_file_path=$($installer.FullName)" >> $env:GITHUB_OUTPUT
          echo "installer_file_name=$($installer.Name)" >> $env:GITHUB_OUTPUT

      # ------------------------------
      - name: Zip Installer
        id: zip_installer
        shell: powershell
        run: |
          $zipPath = "Output\$($env:installer_file_name).zip"
          Write-Host "Zipping installer to $zipPath..."
          Compress-Archive -Path $env:installer_file_path -DestinationPath $zipPath -Force
          Write-Host "Zip complete. Contents of Output folder:"
          Get-ChildItem -Path Output
          echo "zip_file_path=$zipPath" >> $env:GITHUB_OUTPUT
          echo "zip_file_name=$($env:installer_file_name).zip" >> $env:GITHUB_OUTPUT

      # ------------------------------
      - name: Upload .exe Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.find_installer.outputs.installer_file_name }}
          path: ${{ steps.find_installer.outputs.installer_file_path }}

      - name: Upload .zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.zip_installer.outputs.zip_file_name }}
          path: ${{ steps.zip_installer.outputs.zip_file_path }}

      # ------------------------------
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: ${{ steps.find_installer.outputs.installer_file_path }},${{ steps.zip_installer.outputs.zip_file_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
